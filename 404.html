<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다 | 블루엠파트너스 BlueM Partners</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0C2340">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/assets/sub.css">
  <style>
    .nf { background: var(--navy); color: #fff; min-height: calc(100vh - 70px); min-height: calc(100svh - 70px);
          display: flex; align-items: flex-start; position: relative; overflow: hidden; padding: 80px 0 120px; }
    .nf .mark { position: absolute; right: -6%; bottom: -6%; width: min(60vw, 520px); opacity: .14; pointer-events: none; }
    .nf .code { margin: 0; font-size: clamp(88px, 22vw, 160px); font-weight: 800; letter-spacing: -0.04em; line-height: 1;
                color: transparent; -webkit-text-stroke: 2px var(--sky); }
    .nf h1 { margin: 18px 0 12px; font-size: clamp(26px, 6vw, 36px); font-weight: 800; letter-spacing: -0.03em; }
    .nf p { margin: 0 0 32px; color: #D5DEEB; max-width: 30em; }
    .nf .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .nf .btn.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
    .nf .btn.ghost:hover { border-color: #fff; background: rgba(255,255,255,.08); }
    .top { border-bottom: 1px solid rgba(255,255,255,.08); }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/" aria-label="블루엠파트너스 홈">
        <svg viewBox="0 0 2000 1536" aria-hidden="true">
          <rect x="0" y="0" width="286" height="1536" rx="143" fill="#FFFFFF"/>
          <rect x="428" y="500" width="286" height="1036" rx="143" fill="#307FE2"/>
          <rect x="857" y="928" width="286" height="608" rx="143" fill="#71B0E8"/>
          <rect x="1285" y="500" width="286" height="1036" rx="143" fill="#307FE2"/>
          <rect x="1714" y="0" width="286" height="1536" rx="143" fill="#FFFFFF"/>
        </svg>
        BlueM Partners
      </a>
    </div>
  </header>

  <main class="nf">
    <!-- 로고 막대 중 가운데 하나가 빠진 모양: "연결이 끊긴 페이지" -->
    <svg class="mark" viewBox="0 0 2000 1536" aria-hidden="true">
      <rect x="0" y="0" width="286" height="1536" rx="143" fill="#FFFFFF"/>
      <rect x="428" y="500" width="286" height="1036" rx="143" fill="#307FE2"/>
      <rect x="1285" y="500" width="286" height="1036" rx="143" fill="#307FE2"/>
      <rect x="1714" y="0" width="286" height="1536" rx="143" fill="#FFFFFF"/>
    </svg>
    <div class="wrap">
      <p class="code" aria-hidden="true">404</p>
      <h1>찾으시는 페이지가 없습니다</h1>
      <p>주소가 바뀌었거나 잘못 입력되었을 수 있습니다. 아래 버튼으로 이동해 주세요.</p>
      <div class="actions">
        <a class="btn" href="/">처음으로 <span aria-hidden="true">→</span></a>
        <a class="btn ghost" href="/contact/">문의하기</a>
      </div>
    </div>
  </main>
</body>
</html>
